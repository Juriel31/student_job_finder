name: Check job postings

on:
  schedule:
    # Runs every 15 minutes. GitHub may delay this slightly under load.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab
  push:
    branches: [main]
    paths:
      - "config/sources.csv"
      - "scripts/check_jobs.py"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run job checker
        run: python scripts/check_jobs.py

      - name: Commit updated data
        run: |
          git config user.name "job-watchtower-bot"
          git config user.email "actions@github.com"
          git add docs/data/matches.json docs/data/seen.json docs/data/run_meta.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update job data [skip ci]"
            git push
          fi
